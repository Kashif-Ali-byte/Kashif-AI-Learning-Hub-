<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>Kashif-AI-Learning-Hub</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0e1a;
            --bg-secondary: #141b2b;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.06);
            --text-primary: #f0f2ff;
            --text-secondary: #b0b8d0;
            --text-muted: #6a7290;
            --accent-1: #6c3bf0;
            --accent-2: #00d4ff;
            --gradient-main: linear-gradient(135deg, #6c3bf0, #00d4ff);
            --gradient-hero: linear-gradient(135deg, #0b0e1a 0%, #1e0a3a 60%, #0a1a2a 100%);
            --shadow-glow: 0 8px 40px rgba(108, 59, 240, 0.25);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-2);
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(circle at 20% 30%, #1a0a3a 0%, #0b0e1a 70%);
        }
        .bg-canvas .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.2;
            animation: orbFloat 25s ease-in-out infinite alternate;
        }
        .bg-canvas .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: #6c3bf0;
            top: -10%;
            left: -10%;
            animation-duration: 30s;
        }
        .bg-canvas .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #00d4ff;
            bottom: -10%;
            right: -10%;
            animation-duration: 28s;
            animation-delay: 4s;
        }
        .bg-canvas .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: #f72585;
            top: 40%;
            left: 40%;
            animation-duration: 22s;
            animation-delay: 8s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(60px, -40px) scale(1.1);
            }
            66% {
                transform: translate(-30px, 50px) scale(0.9);
            }
            100% {
                transform: translate(40px, 20px) scale(1.05);
            }
        }

        /* ===== APP WRAPPER ===== */
        .app-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 0 14px;
            border-bottom: 1px solid var(--border-glass);
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo i {
            margin-right: 8px;
            -webkit-text-fill-color: var(--accent-2);
        }
        .header-actions {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .btn-back {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            padding: 8px 18px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
            font-family: inherit;
        }
        .btn-back:hover {
            background: var(--bg-card-hover);
            color: #fff;
            border-color: var(--accent-2);
        }
        .btn-back i {
            font-size: 14px;
        }

        /* ===== VIEWS ===== */
        .view {
            display: none;
            animation: fadeUp 0.4s ease forwards;
        }
        .view.active {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== HERO ===== */
        .hero {
            padding: 40px 0 30px;
            text-align: center;
        }
        .hero h1 {
            font-size: clamp(2.2rem, 7vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.1;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(108, 59, 240, 0.15);
        }
        .hero h1 .highlight {
            background: linear-gradient(135deg, #f72585, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero p {
            max-width: 550px;
            margin: 12px auto 0;
            font-size: 18px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* ===== TRACK CARDS (Home) ===== */
        .track-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 28px;
            margin-top: 30px;
        }
        @media (min-width: 768px) {
            .track-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .track-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 32px 28px 28px;
            backdrop-filter: blur(12px);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .track-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--gradient-main);
            opacity: 0;
            transition: var(--transition);
        }
        .track-card:hover::before {
            opacity: 1;
        }
        .track-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-glow);
            border-color: rgba(108, 59, 240, 0.2);
        }
        .track-card.disabled {
            opacity: 0.5;
            filter: grayscale(0.5);
            pointer-events: none;
        }
        .track-card.disabled::after {
            content: '🔒 Coming Soon';
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(247, 37, 133, 0.15);
            color: #f72585;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid rgba(247, 37, 133, 0.2);
        }
        .track-card .tc-icon {
            font-size: 32px;
            margin-bottom: 12px;
            color: var(--accent-2);
        }
        .track-card h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .track-card p {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 16px;
            flex: 1;
        }
        .track-card .tc-btn {
            background: var(--gradient-main);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            align-self: flex-start;
            font-family: inherit;
            box-shadow: 0 4px 20px rgba(108, 59, 240, 0.25);
        }
        .track-card .tc-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 30px rgba(108, 59, 240, 0.4);
        }

        /* ===== MODULE CARDS (Track Detail) ===== */
        .module-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            margin-top: 24px;
        }
        @media (min-width: 600px) {
            .module-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (min-width: 1024px) {
            .module-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        .module-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 24px 22px 20px;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .module-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-3px);
            border-color: rgba(0, 212, 255, 0.15);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }
        .module-card .mc-icon {
            font-size: 28px;
            color: var(--accent-2);
            margin-bottom: 8px;
        }
        .module-card h3 {
            font-size: 18px;
            font-weight: 600;
        }
        .module-card p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .module-card .mc-badge {
            display: inline-block;
            margin-top: 10px;
            font-size: 13px;
            color: var(--accent-2);
            background: rgba(0, 212, 255, 0.06);
            padding: 2px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 212, 255, 0.08);
        }

        /* ===== LECTURE TABLE (Module Detail) ===== */
        .lecture-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }
        .lecture-item {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .lecture-item:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-2);
            transform: translateX(4px);
        }
        .lecture-item .li-num {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            min-width: 40px;
        }
        .lecture-item .li-title {
            flex: 1;
            font-size: 15px;
            font-weight: 500;
        }
        .lecture-item .li-icon {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ===== PAGE HEADER (Track/Module detail) ===== */
        .page-header {
            padding: 20px 0 10px;
        }
        .page-header h2 {
            font-size: 28px;
            font-weight: 700;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header .sub {
            color: var(--text-secondary);
            font-size: 16px;
            margin-top: 4px;
        }
        .page-header .desc {
            color: var(--text-muted);
            font-size: 15px;
            max-width: 700px;
            margin-top: 8px;
            line-height: 1.7;
        }
        .page-header .goal {
            background: rgba(108, 59, 240, 0.06);
            border-left: 4px solid var(--accent-1);
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            margin-top: 12px;
            font-size: 15px;
            color: var(--text-secondary);
        }
        .page-header .goal strong {
            color: #fff;
        }

        /* ===== BACK BUTTON ===== */
        .back-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 50px;
            padding: 24px 0 10px;
            border-top: 1px solid var(--border-glass);
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }
        .footer .motivation {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .footer .motivation i {
            color: var(--accent-2);
            margin: 0 6px;
        }

        /* ===== LECTURE DETAIL OVERLAY (placeholder) ===== */
        .lecture-detail-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(20px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .lecture-detail-overlay.open {
            display: flex;
        }
        .lecture-detail-box {
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            overflow-y: auto;
            animation: fadeUp 0.3s ease;
            position: relative;
        }
        .lecture-detail-box .ld-close {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            font-size: 28px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            padding: 0 0 0 16px;
        }
        .lecture-detail-box .ld-close:hover {
            color: #fff;
            transform: rotate(90deg);
        }
        .lecture-detail-box h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .lecture-detail-box .ld-meta {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 16px;
        }
        .lecture-detail-box .ld-body {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.8;
        }
        .lecture-detail-box .ld-body .placeholder {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-glass);
            padding: 30px 20px;
            border-radius: var(--radius-sm);
            text-align: center;
            color: var(--text-muted);
        }

        /* ===== RESPONSIVE TWEAKS ===== */
        @media (max-width: 480px) {
            .app-wrapper {
                padding: 0 12px 30px;
            }
            .header .logo {
                font-size: 18px;
            }
            .btn-back {
                padding: 6px 14px;
                font-size: 13px;
            }
            .track-card {
                padding: 24px 18px 20px;
            }
            .track-card h2 {
                font-size: 19px;
            }
            .module-card {
                padding: 18px 16px 16px;
            }
            .page-header h2 {
                font-size: 22px;
            }
            .lecture-item {
                padding: 10px 14px;
                gap: 10px;
            }
            .lecture-item .li-title {
                font-size: 14px;
            }
            .lecture-detail-box {
                padding: 24px 18px;
            }
        }

        /* ===== UTILITY ===== */
        .mt-2 {
            margin-top: 16px;
        }
        .mb-1 {
            margin-bottom: 8px;
        }
        .text-muted {
            color: var(--text-muted);
        }
        .text-gradient {
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .fade-in {
            animation: fadeUp 0.6s ease forwards;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- ===== BACKGROUND ===== -->
    <div class="bg-canvas">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- ===== LECTURE DETAIL OVERLAY ===== -->
    <div class="lecture-detail-overlay" id="lectureOverlay">
        <div class="lecture-detail-box">
            <button class="ld-close" id="ldClose">&times;</button>
            <div id="lectureContent">
                <h3 id="ldTitle">Lecture Title</h3>
                <div class="ld-meta" id="ldMeta">Module · Track</div>
                <div class="ld-body" id="ldBody">
                    <div class="placeholder">
                        <i class="fas fa-edit" style="font-size:32px;color:var(--accent-2);display:block;margin-bottom:12px;"></i>
                        <p><strong>Content coming soon!</strong></p>
                        <p style="font-size:14px;margin-top:6px;">Aap yahan har lecture ka detailed data baad mein set kar sakte hain.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== APP ===== -->
    <div class="app-wrapper" id="app">

        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-brain"></i> Kashif-AI-Le
